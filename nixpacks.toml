[phases.setup]
commands = [
  "npm install",
  "composer install --no-dev --optimize-autoloader"
]

[phases.build]
commands = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

# Prevent Nixpacks from scanning the public directory
[variables]
NIXPACKS_IGNORE_FILES = "public/**"
